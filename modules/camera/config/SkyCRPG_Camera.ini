; Camera-only preferences; never stored in game saves.
[Camera]
iSchemaVersion=1
bEnabled=1
fPitchDegrees=55
fPitchSpeedDegrees=90
fRecenterSpeedDegrees=180
; Native requested zoom scalar; SmoothCam retains smoothing and collision.
fZoom=0.65
fMinZoom=0.25
fMaxZoom=0.90

[TargetLock]
; Opt-in candidate; requires the separate TDM target-lock overlay in this profile.
; Restore the Phase 4 TDM fragment when disabling; appearance/timing need the route.
bEnabled=0
; Separate SkyCRPG_Camera_TargetLock.log: lock +/-16 polls, max 2048 rows.
; Includes look input; asynchronous flush every 100 ms (recent rows may be lost).
iLockFrameTrace=0
; Decimal Skyrim.esm form ID: 0x000AAEB3 LifeDetectedUndead; no bundled art.
iIndicatorShaderFormID=700083
; Test parameter in seconds; must match the TDM fragment/live MCM value.
fPOVHoldSeconds=0.4

[Obstruction]
; Candidate: opt in with 1 on an isolated test profile. No per-profile overlay
; exists, so shipped/missing-key default is OFF pending Windows/game validation.
; Read-only rendered-root/current-SmoothCam-goal compression; no extra casts.
bEnabled=0
fEnterRatio=0.25
fExitRatio=0.10
fEnterSeconds=0.25
fExitSeconds=0.8
fWarmupSeconds=0.5
fTightPitchDegrees=25
fTightZoom=0.35
; Framing blend per second; recovery probes pause when compression rises.
fTightenRate=0.8
fRecoverRate=0.15

[Controls]
; DirectInput keyboard scans: F6 native first-person/return, F7 recenter.
; F8 remains SmoothCam's independent emergency toggle.
iToggleKey=64
iRecenterKey=65
; Optional single gamepad bit masks; -1 unbound. Native-mapped buttons rejected.
iToggleGamepad=-1
iRecenterGamepad=-1

[Debug]
iLogLevel=1
; Opt-in transition decisions (128 lines); independent of the lock frame trace.
iLifecycleTrace=0

; Stage 1 only. Restart after editing. OFF installs no thin-occluder hooks/scans.
; Native enclosure collision and SmoothCam transform ownership remain enabled.
[ThinOccluder]
bEnabled=0
fTargetAlpha=0.35
; Opt-in height extrema/deltas, cumulative counters and hook cost; ~10 Hz.
; 12000 lines after a loaded game (about 20 minutes); logging adds measured cost.
iTrace=0
; Explicit load-order-safe STAT base allowlist. Hex LOCAL form IDs, not references.
; At most 16 entries. Missing/non-static entries refuse the entire feature.
; Only extend after reviewing the complete mesh and collision: never add enclosure.
iFormCount=3
sForm0=Skyrim.esm|0602A6
sForm1=Skyrim.esm|0602AF
sForm2=Skyrim.esm|0616EA

[CursorMode]
; DYL-200 opt-in. Requires Selection v2 cursor extension and its separate
; bAllowExternalTargets=1 opt-in. No UI DLL, SWF or crosshair hook in Camera.
bEnabled=0
; B (DIK 48), stock-map unmapped; owner-approved default 2026-11-08 (D5-2).
; Remaps refuse at runtime.
iToggleKey=48
; No pad default (owner decision 2026-11-08); the controller pass decides it.
; D-pad Left (4) would need the owner to remap native Hotkey1 first.
; There is no free stock pad button; R3 (128) is reserved by D027.
iToggleGamepad=-1
; Pixels per native look unit; mouse and right-stick use the same delta path.
; 65 is about 1 pixel per mouse count at default native mouse sensitivity.
; 65 / 48 / 12 below are owner-approved provisional defaults (2026-11-08),
; measured on a 1920x1080 window; adjust after the hands-on run.
fSensitivity=65
; Pick slack in pixels outside an object's projected screen box.
fPickRadiusPixels=48
; Cycled target remains latched until pointer moves MORE than this distance.
; While the mode is active, [ ] cycling visits only candidates with an
; on-screen box; Selection skips the rest (owner decision 2026-11-08).
fLatchMovePixels=12
; Opt-in pick cost/cumulative projection+push samples, line cap (0..512).
iTrace=0

; P5.5-02 wave 1 disposable spike (DYL-217). Never shipped; this branch is not
; merged. Restart after editing. OFF allocates, installs and evaluates nothing.
; With 1: world heading and requested zoom are held in the normal and
; target-lock states, SmoothCam's collision casts report "no hit", the
; DYL-157 compression policy is suppressed and F7 returns to fHeadingDegrees.
[FixedCameraSpike]
bEnabled=0
; Compass heading the camera looks toward: 0 north (+Y), 90 east (+X). The four
; held headings are this value + 0/90/180/270.
fHeadingDegrees=45
; Eased snap turn; always ends exactly on one of the four headings.
fSnapSeconds=0.25
; Native requested zoom scalar held while eligible (wheel, POV slide ignored).
; [Camera] fZoom is not rewritten.
fZoom=0.65
; Comma / period (DIK 51 / 52): unmapped in every stock control context and
; unused by Camera, cursor mode, Selection and the TDM overlay. Keyboard only.
; -1 unbinds; reserved or natively mapped keys are refused.
iSnapLeftKey=51
iSnapRightKey=52
; 1 still runs each suppressed native cast on private copies and counts what it
; would have hit (rig trace visibleWouldHit). The native cast ignores hidden
; (app-culled) objects, so with iSeeThroughMode=1 this counts visible geometry
; only. 0 skips the native sweep.
iCastProbe=1
; Traces go to SkyCRPG_Camera_FixedSpike.log (asynchronous, ~10 Hz).
; Rig: 12000 lines. Camera, player, offset, pre-collision position, pull-in,
; heading, pitch, zoom, policy state and cast counters per window.
iRigTrace=0
; 0 vanilla (no hook), 1 player's room, 2 rooms on the camera-player sightline,
; 3 rooms whose bound is within fRoomSeedRadius of the player. Only queries from
; the three culling passes, made at the rendered camera position, are ever
; answered differently; reference attachment and water lookups stay vanilla.
iRoomSeedMode=0
fRoomSeedRadius=1024
; Room: 12000 lines. Graph present, room count, player and camera room, hook
; calls by caller class and claims per window.
iRoomTrace=0
; 0 none, 1 hide: app-cull references wholly above fCutHeight over the
; player's feet and within fHideRadius of them, and architecture hit by a
; camera-player ray. Never actors, lights, the floor under the player, or a
; floor-bearing piece (traced as skips). INTERIOR CELLS ONLY in this wave: in
; an exterior cell nothing is scanned, ray-cast or hidden (one FCS-31 line).
iSeeThroughMode=0
fCutHeight=160
; Ground-plane reach from the feet for above-cut hides (128-2048). The camera
; stands about 190-216 units from the player in the ground plane at the
; shipped framing; 384 adds most of one 256-unit kit tile on every side.
; A hidden piece is restored 64 units beyond this, after the usual dwell.
fHideRadius=384
; Both caps are nearest-first: the nearest pieces are hidden first, and a full
; table gives up its farthest entry to a nearer one.
iHideMaxPerFrame=16
iHideMaxTotal=192
; Hide: 8000 lines. hide / restore / skip per reference with form IDs, model
; and reason, plus a cumulative summary each second.
iHideTrace=0
; --- Wave 2 package "light" (default off; with both modes 0 nothing is
; allocated, read or installed). Refusals FCS-51..59.
; 1 = PRESENTATION AID, changes the look: a dynamic point light (no shadows,
; not portal-strict, no distance fade) that follows the player in INTERIOR
; cells. It adds light the cell does not have. Lit while the rig is engaged and
; in third-person states the rig hands off (precision aim, targeting,
; obstruction, mount/swim/beast/bleedout/furniture); left exactly as it was
; while a menu or the console is open; hidden at once in first person, with
; Camera off or F8, on a load, on death and in exterior cells, and handed back
; to the engine (RemoveLight) after 0.5 s hidden.
iLightFillMode=0
; Height above the feet (0-1024), radius (64-4096), NiLight fade 0.1-4.0
; (the engine switches a light off below 0.05) and diffuse colour (0-1 each).
fLightFillHeight=192
fLightFillRadius=640
fLightFillFade=0.6
fLightFillRed=1.0
fLightFillGreen=0.86
fLightFillBlue=0.70
; 1 (default): the fill light adds nothing to the player's or any actor's
; light level (stealth); its own term is taken out of the engine's sums. If
; that cannot be installed on this game build the fill light is refused
; (FCS-58/59). 0: it counts like a carried torch.
bLightFillStealthNeutral=1
; Light: 6000 lines, about 10 Hz in eligible frames. Census of the engine's
; active point and shadow lights against the player point (feet + 64): how
; many contain it, how many of those are culled or faded by the camera, which
; shadow lights hold one of the four shadow-mask channels, the nearest light,
; plus fill-light state, add/remove/hide/show events and, with the fill
; light on, the player's light-level sum with and without it. Read-only.
iLightTrace=0
