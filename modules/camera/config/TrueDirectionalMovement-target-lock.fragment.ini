; OPT-IN TEST OVERLAY ONLY. Apply after the Phase 4 settings fragment, only to
; an isolated profile with Camera [TargetLock] bEnabled=1. Merge, never replace.
; tools/package.py deliberately does not package or merge this overlay.
; A lease-held overlay can swallow short R3. bEnabled=0 equals the Phase 4
; base only with this overlay removed/restored. Remove it when disabling lock.
; Player distribution is an owner decision at P5-06.
[TargetLock]
; Candidate R3: short press locks, hold invokes native POV. Route parameter,
; not a measured/approved hold. Match Camera fPOVHoldSeconds when changing it.
uTargetLockMode = 1
fTargetLockYawAdjustSpeed = 0
fTargetLockPitchAdjustSpeed = 0
bResetCameraWithTargetLock = 0
bResetCameraPitch = 0
bTargetLockEnableLockBehindTarget = 0
uTargetLockArrowAimType = 1
uTargetLockMissileAimType = 1
bTargetLockUsePOVSwitchGamepad = 1
fTargetLockPOVHoldDuration = 0.4
bTargetLockUseMouse = 0
bTargetLockUseScrollWheel = 0
bTargetLockUseRightThumbstick = 0
bTargetLockUsePOVSwitchKeyboard = 0

[HUD]
bEnableTargetLockReticle = 0

[Keys]
; U (DIK 22) is an unapproved keyboard test default. No spare controller
; switch binding is assumed; switching/cursor proposal returns to the owner.
uTargetLockKey = 22
uSwitchTargetLeftKey = -1
uSwitchTargetRightKey = -1
uTargetLockBehindTargetKey = -1
