; Original MIT SkyCRPG selection. Independent of Camera/UI and all providers.
[Selection]
iSchemaVersion=1
bEnabled=1
; Opt-in only for a later API client; no caller is required or registered.
; API v2 queues requests for Pick; no synchronous engine calls on the caller.
bAllowExternalTargets=0
; 0 = live fActivatePickLength:Interface (180 in the audited executable).
; Positive values may shorten but never extend native reach.
fSearchRadius=0
fRefreshSeconds=0.1
; Nearby geometry, cheap origin visits and physics rays are separate.
; Native predicates validate nearest 8; up to 8 more preserve a frozen latch.
iMaxReferences=4096
iMaxVisited=65536
iMaxScanRays=48
; Broad-phase origin horizon = native radius + this padding (not extra reach).
; Includes large/offset bounds; native pick is always considered regardless.
fBoundsSearchPadding=2048
fLatchSeconds=10
fLatchMoveUnits=64

[Controls]
; UNAPPROVED keyboard test proposals: [ next, ] previous (DIK 26/27).
; Native mappings and reserved Camera/minimap/hotbar keys refuse the action.
iCycleNextKey=26
iCyclePreviousKey=27
; -1 = unbound. Single gamepad button masks only, no implicit chord or R3.
iCycleNextGamepad=-1
iCyclePreviousGamepad=-1

[Debug]
; <=2000 event rows + one dropped marker. Every cycle/pick-pair change emits.
; Diagnostics flush every 250ms off Pick; summaries report suppressed rows.
bDiagnostics=0
; At most this many diagnostics per process (hard cap 128), one per 5 seconds.
iDiagnosticLimit=32
