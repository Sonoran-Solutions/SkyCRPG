; SkyCRPG UI settings. Owned only by the SkyCRPG UI package.
; Restart after editing. Defaults are a bounded safe reset for the HUD layout.
[Settings]
iVersion=1

[HUD]
bEnabled=1
iScalePercent=100
iOffsetX=0
iOffsetY=0
; Set to 1 and restart to ignore scale/offset keys and use 100%, 0, 0.
; No file is rewritten. Keep 1 for defaults, or set 0 to use these keys again.
bResetLayout=0

[Inventory]
; 1 = while the player inventory is open, shift the 3D item preview right of the
; grid and scale it down; the previous values are restored on close. Runtime
; only: no game or user INI file is written. 0 = leave the preview untouched.
bManageItemPreview=1
; Optional overrides; leave empty for the computed values.
; fItemPreviewScale: factor on the current preview scale, 0.4 to 1.0.
; fItemPreviewXShift: added to fInventory3DItemPosX(Wide); negative is right, -100 to 20.
fItemPreviewScale=
fItemPreviewXShift=

[Minimap]
bReplaceCompass=1

[Debug]
iLogLevel=1
