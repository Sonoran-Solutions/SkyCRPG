; SkyCRPG UI settings. Owned only by the SkyCRPG UI package.
; Restart after editing. Defaults are a bounded safe reset for the HUD layout.
[Settings]
iVersion=1

[HUD]
bEnabled=1
iScalePercent=100
iOffsetX=0
iOffsetY=0
; Set to 1 and restart to ignore scale/offset keys and use 100%, 0, 0.
; No file is rewritten. Keep 1 for defaults, or set 0 to use these keys again.
bResetLayout=0

[Minimap]
bReplaceCompass=1

[Debug]
iLogLevel=1
