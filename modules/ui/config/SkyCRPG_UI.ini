; SkyCRPG UI settings. Owned only by the SkyCRPG UI package.
; Restart after editing. Defaults are a bounded safe reset for the HUD layout.
[Settings]
iVersion=1

[HUD]
bEnabled=1
iScalePercent=100
iOffsetX=0
iOffsetY=0
; Set to 1 and restart to ignore scale/offset keys and use 100%, 0, 0.
; No file is rewritten. Keep 1 for defaults, or set 0 to use these keys again.
bResetLayout=0

[Inventory]
; 1 = while the player inventory is open, centre the 3D item preview over the
; item card and scale it to fit, by adjusting the engine's in-memory placement
; for that menu only. No game or user INI file or setting is written; the next
; menu open starts from the game's own values. 0 = leave the preview untouched.
bManageItemPreview=1
; Optional overrides; leave empty for the computed values.
; fItemPreviewScale: factor on the game's preview scale, 0.4 to 1.0.
; fItemPreviewXShift: added to the game's horizontal position instead of
; centring over the card; negative is right, -100 to 20.
fItemPreviewScale=
fItemPreviewXShift=

[Minimap]
bReplaceCompass=1

[Debug]
iLogLevel=1
