; NEVER SHIP. Copy only beside this diagnostic DLL in an isolated profile.
[Spike]
; Hard kill: OFF installs no hooks/tasks/sinks. Live OFF is polled every 500 ms,
; restores and latches OFF until process restart. Mode changes require restart.
bEnabled=0
; Exactly one: baseline, observe, filter, material_alpha, alpha_property,
; filter_material_alpha, filter_alpha_property (filter + fade same reference),
; app_culled, room_seed_1, room_seed_2, room_seed_3, near_clip.
; near_clip refuses: the 1.7.104 projection-update ABI is unresolved.
sMode=observe
; Full runtime (load-order resolved) hexadecimal IDs, comma separated, max 64.
; Combined modes require sReferenceIDs = sSelectedReference (exactly one),
; with no base IDs. Up to eight >= hull-diameter steps; all-contact gap sweeps
; refuse enclosure/unknown/overflow contacts and keep the original native hit.
; Use empty or none for an empty ID list (none works in route INI overrides).
; Empty allowlists never discard. No name/normal/room-based filtering.
sReferenceIDs=
sBaseFormIDs=
; One loaded static/movable-static reference in the player's current cell.
; KP0 applies/arms; KP9 restores/stops. F6/F8/POV/menu/load/cell disarm.
; KP0=DIK 0x52 and KP9=DIK 0x49 are unmapped in the stock controlmap.
; KP0/KP9 refuse if mapped to a native action. All input remains unconsumed.
sSelectedReference=
; Values below 0.10 are rejected as too close to hidden for this experiment.
fAlpha=0.35
; Alpha-property mode creates a private native property per geometry and restores
; each original pointer (including null). Alpha modes try native unique material
; clones; shared shader/factory fallback is explicitly logged as shared.
; Fade modes count original caster contacts per reference every 500 ms.
fSeedDistance=1500
; Observe records are sampled 1/16. Critical recast/discard records bypass this
; cap and are flushed synchronously. Any cap makes the run INCONCLUSIVE.
iMaxHitRecords=100000
; Live label read on each KP0: use standing, then turning, for matched captures.
sCaptureLabel=unlabeled
; All enabled sessions stop after 20 minutes. Quit/restart between modes.
