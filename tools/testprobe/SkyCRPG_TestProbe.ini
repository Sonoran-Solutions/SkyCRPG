; Test-only: the runner installs this beside the DLL in its disposable profile.
[Probe]
bEnabled=1
; 0 disables the timer AND request polling; event-triggered snapshots remain.
iStateIntervalMs=1000
; P5.5-01 view_sample (README "View samples"). Absent or 0: no @view namespace,
; no view timer, base behaviour. @view requests need iStateIntervalMs>0 (polling).
bViewSamples=1
; 0 = no periodic view samples; otherwise at least 100 ms.
iViewIntervalMs=0
iViewRingPoints=8
iViewRingRadius=128
iViewMaxHits=8
; 1 = sample only on Main::threadID (unpaused play then yields off_main_thread).
bViewMainThreadOnly=0
